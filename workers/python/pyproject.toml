[project]
name = "celyrion-workers"
version = "0.1.0"
description = "Python model adapters and Triton kernels for the Celyrion inference engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Uncomment once real kernels land; both pull in large GPU wheels.
# triton = ["triton>=3.0"]
# torch = ["torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/celyrion_workers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
